name: Feature request
description: Suggest a new tool, phase, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What are you trying to do that the repo does not cover today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Which doc or script would change, and how?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: source
    attributes:
      label: Package source
      description: The repo prefers official repositories over the AUR.
      options:
        - Official repository
        - AUR
        - Upstream installer
        - Not applicable
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and docs first
          required: true
        - label: I am willing to open a pull request
